services:
    mysql:
      image: mysql:8.0
      container_name: aqa-diplom-mysql
      environment:
        MYSQL_DATABASE: app
        MYSQL_USER: app
        MYSQL_PASSWORD: pass
        MYSQL_ROOT_PASSWORD: root
      volumes:
        - mysql-data:/var/lib/mysql
      ports:
        - "3307:3306"
volumes:
  mysql-data:


