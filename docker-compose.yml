services:
  mysql:
    image: mysql:8.0
    container_name: aqa-diplom-mysql
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: pass
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3307:3306"
command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
healthcheck:
  test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "app", "-ppass" ]
  interval: 5s
  timeout: 5s
  retries: 10
  start_period: 10s

volumes:
  mysql-data:


