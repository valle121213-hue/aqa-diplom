plugins {
    id 'java'
    id 'io.qameta.allure' version '2.11.2'
}

group 'ru.netology'
version '1.0-SNAPSHOT'

java {
    sourceCompatibility = 11
}

compileJava.options.encoding = "UTF-8"
compileTestJava.options.encoding = "UTF-8"

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'com.codeborne:selenide:6.19.1'
    testImplementation 'commons-dbutils:commons-dbutils:1.8.1'
    testImplementation 'com.mysql:mysql-connector-j:9.0.0'

    testImplementation 'io.qameta.allure:allure-selenide:2.29.1'
    testImplementation 'org.slf4j:slf4j-simple:2.0.3'

    testImplementation 'org.projectlombok:lombok:1.18.36'
    testCompileOnly 'org.projectlombok:lombok:1.18.36'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.36'
}

test {
    useJUnitPlatform()
    systemProperty 'chromeoptions.prefs',
            System.getProperty(
                    'chromeoptions.prefs',
                    'profile.password_manager_leak_detection=false'
            )
}

allure {
    version = '2.29.1'
    autoconfigure = true
}
